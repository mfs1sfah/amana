<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة شبكة أمانة للرعاية الصحية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0076A8; --secondary: #00A3E0; --success: #10b981; --danger: #ef4444; --bg: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; --shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        body.dark-mode { --primary: #0ea5e9; --secondary: #38bdf8; --bg: #111827; --card-bg: #1f2937; --text-main: #f9fafb; --text-muted: #9ca3af; --border: #374151; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; transition: background-color 0.3s; }
        
        .author-banner { background-color: #111827; color: #e5e7eb; text-align: center; padding: 12px; font-size: 0.9rem; font-weight: 500; }
        .author-banner a { color: var(--secondary); text-decoration: none; font-weight: bold; direction: ltr; display: inline-block; }
        header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 3rem 1rem; text-align: center; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        .top-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; }
        .icon-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 8px 16px; border-radius: 50px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-family: 'Tajawal'; font-weight: bold;}
        .container { max-width: 1200px; margin: -2.5rem auto 2rem auto; padding: 0 1rem; position: relative; z-index: 10; }
        
        .system-panel { background: var(--card-bg); border-radius: 16px; padding: 2rem; box-shadow: var(--shadow); margin-bottom: 2rem; border: 1px solid var(--border); text-align: center; }
        .btn-fetch { background: var(--primary); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; width: 100%; max-width: 400px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; font-family: 'Tajawal'; transition: 0.3s;}
        .btn-fetch:hover { background: var(--secondary); }
        .btn-reset { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; padding: 0.8rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; display: none; margin: 1rem auto 0 auto; gap: 8px; font-family: 'Tajawal';}
        
        .upload-section { display: none; margin-top: 1.5rem; border: 2px dashed var(--secondary); border-radius: 12px; padding: 2.5rem; position: relative; cursor: pointer; background: rgba(0, 163, 224, 0.05); }
        .upload-section input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .status-msg { margin-top: 1.5rem; font-weight: bold; font-size: 1rem; display: none; padding: 1rem; border-radius: 8px; line-height: 1.6; }
        .status-success { color: #065f46; background: #d1fae5; border: 1px solid #10b981;}
        .status-error { color: #991b1b; background: #fee2e2; border: 1px solid #ef4444;}
        
        .filters { display: none; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 2rem; background: var(--card-bg); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .search-wrapper { grid-column: 1 / -1; position: relative; }
        .search-wrapper i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .filters input { width: 100%; padding: 1rem 1rem 1rem 2.5rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1.05rem; background: var(--bg); color: var(--text-main); font-family: 'Tajawal'; outline: none;}
        .filters select { padding: 1rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; background: var(--bg); color: var(--text-main); font-family: 'Tajawal'; outline: none; cursor: pointer;}
        .filters select:disabled { opacity: 0.5; cursor: not-allowed; }

        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 1.5rem; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; border-top: 4px solid var(--secondary);}
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
        .card-title { font-size: 1.1rem; font-weight: 800; margin: 0; color: var(--primary); line-height: 1.4;}
        
        .badges-container { display: flex; flex-direction: column; gap: 5px; align-items: flex-end;}
        .badge { padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: bold; white-space: nowrap;}
        .badge-class { background: rgba(0, 163, 224, 0.1); color: var(--primary); }
        .badge-gov { background: #dcfce7; color: #166534; border: 1px solid #86efac;}
        .badge-pvt { background: #fef9c3; color: #854d0e; border: 1px solid #fde047;}
        body.dark-mode .badge-gov { background: #064e3b; color: #a7f3d0; border-color: #059669;}
        body.dark-mode .badge-pvt { background: #713f12; color: #fef08a; border-color: #a16207;}
        
        .info-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 0.8rem; color: var(--text-muted); font-size: 0.95rem; font-weight: 500;}
        .info-row i { color: var(--secondary); width: 20px; text-align: center; margin-top: 4px; font-size: 1.1rem;}
        
        .contact-box { background: rgba(16, 185, 129, 0.1); border: 1px dashed var(--success); color: var(--success); padding: 0.6rem; border-radius: 8px; margin-top: auto; font-weight: bold; text-align: center; direction: ltr; font-size: 1rem;}
        .map-btn { background: var(--success); color: white; padding: 0.8rem; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 1rem; transition: 0.3s;}
        .map-btn:hover { background: #059669; }
        .load-more { background: var(--bg); color: var(--text-main); border: 2px solid var(--border); padding: 1rem; border-radius: 50px; width: 100%; margin-top: 2rem; cursor: pointer; font-weight: bold; font-family: 'Tajawal'; display: none; font-size: 1.1rem;}
    </style>
</head>
<body>

    <div class="author-banner">
        <i class="fas fa-code"></i> تمت البرمجة والتصميم بواسطة محمد الكثيري | للتواصل: <a href="mailto:mfs8567@gmail.com">mfs8567@gmail.com</a>
    </div>

    <header>
        <div class="top-controls">
            <button class="icon-btn" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
            <button class="icon-btn" onclick="toggleLanguage()"><i class="fas fa-globe"></i> <span id="langTxt">EN</span></button>
        </div>
        <h1 id="titleTxt" style="margin-bottom: 10px; font-weight: 800;">بوابة شبكة أمانة للرعاية الصحية</h1>
        <p id="subTitleTxt" style="margin-top: 0; font-size: 1.1rem; opacity: 0.9;">دليلك الأسرع للوصول إلى المستشفيات والمراكز المعتمدة</p>
    </header>

    <div class="container">
        <div class="system-panel" id="systemPanel">
            <button class="btn-fetch" id="btnFetch" onclick="fetchLatestData()">
                <i class="fas fa-cloud-download-alt"></i> <span id="btnFetchTxt">تحديث وسحب الشبكة الطبية تلقائياً</span>
            </button>
            
            <button class="btn-reset" id="btnReset" onclick="resetData()">
                <i class="fas fa-trash-alt"></i> <span id="btnResetTxt">حذف البيانات والبدء من جديد</span>
            </button>

            <div id="statusMsg" class="status-msg"></div>

            <div class="upload-section" id="uploadSection">
                <i class="fas fa-file-pdf" style="font-size: 3.5rem; color: var(--secondary); margin-bottom: 15px;"></i>
                <h3 id="uploadTxt" style="margin: 0 0 10px 0; color: var(--primary);">اضغط هنا لرفع ملف الـ PDF يدوياً</h3>
                <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">يدعم جميع ملفات شبكة أمانة</p>
                <input type="file" id="fileInput" accept=".pdf">
            </div>
        </div>

        <div class="filters" id="filtersBox">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث باسم المستشفى، التخصص، أو الفئة...">
            </div>
            <select id="insuranceClassSelect"><option value="">جميع فئات التأمين</option></select>
            <select id="citySelect"><option value="">اختر المدينة</option></select>
            <select id="districtSelect" disabled><option value="">اختر الحي</option></select>
        </div>

        <div class="results" id="resultsContainer"></div>
        <button class="load-more" id="loadMoreBtn" onclick="loadMoreCards()">عرض المزيد</button>
    </div>

    <script>
        let isDark = false;
        let currentLang = 'ar';
        let networkData = [];
        let currentFilteredData = [];
        let displayedCount = 0;
        const ITEMS_PER_PAGE = 30;

        const sanitize = (str) => {
            if (!str) return '';
            const temp = document.createElement('div');
            temp.textContent = str;
            return temp.innerHTML;
        };

        const normalizeArabic = (text) => {
            if(!text) return "";
            return text.replace(/[أإآا]/g, 'ا').replace(/[ةه]/g, 'ه').replace(/[يى]/g, 'ي').replace(/[\u064B-\u065F\u0640]/g, '').toLowerCase().trim();
        };

        const sortArabic = (a, b) => a.localeCompare(b, 'ar-SA');

        window.onload = () => {
            const savedData = localStorage.getItem('amana_network_data');
            if (savedData) {
                networkData = JSON.parse(savedData);
                document.getElementById('btnFetch').style.display = 'none';
                document.getElementById('btnReset').style.display = 'inline-flex';
                initFilters();
            }
        };

        function resetData() {
            if(confirm("هل أنت متأكد من حذف البيانات والبدء من جديد؟")) {
                localStorage.removeItem('amana_network_data');
                location.reload();
            }
        }

        function toggleDarkMode() {
            isDark = !isDark;
            document.body.classList.toggle('dark-mode', isDark);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langTxt').innerText = currentLang === 'ar' ? "EN" : "AR";
            document.getElementById('titleTxt').innerText = currentLang === 'ar' ? "بوابة شبكة أمانة للرعاية الصحية" : "Amana Healthcare Network";
            document.getElementById('subTitleTxt').innerText = currentLang === 'ar' ? "دليلك الأسرع للوصول إلى المستشفيات" : "Your fastest guide to approved hospitals";
            document.getElementById('btnFetchTxt').innerText = currentLang === 'ar' ? "تحديث وسحب الشبكة تلقائياً" : "Auto-Fetch Network";
            document.getElementById('btnResetTxt').innerText = currentLang === 'ar' ? "حذف البيانات والبدء من جديد" : "Delete Data & Reset";
            document.getElementById('searchInput').placeholder = currentLang === 'ar' ? "ابحث باسم المستشفى..." : "Search hospital name...";
            if(networkData.length > 0) applyFilters();
        }

        // --- السحب التلقائي ---
        async function fetchLatestData() {
            const btn = document.getElementById('btnFetch');
            const statusMsg = document.getElementById('statusMsg');
            const uploadSection = document.getElementById('uploadSection');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال بخادم أمانة...';
            statusMsg.style.display = 'none';

            try {
                const response = await fetch('/api/fetch-latest');
                const result = await response.json();

                if (result.status === "success") {
                    saveAndInitData(result.data, `<i class="fas fa-check-circle"></i> تم سحب الشبكة بنجاح!`);
                } else throw new Error(result.message);
            } catch (error) {
                btn.style.display = 'none';
                statusMsg.innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i> يوجد خطأ يمنع سحب البيانات (حماية موقع الشركة).<br><br>
                    <strong>أضف البيانات بشكل يدوي عبر رفع ملف الـ PDF.</strong><br>
                    <a href='https://www.amana.sa/' target='_blank' style="display:inline-block; margin-top:10px; color:#991b1b; text-decoration:underline;">
                        <i class='fas fa-external-link-alt'></i> اضغط هنا لفتح موقع أمانة وتحميل الملف
                    </a>`;
                statusMsg.className = 'status-msg status-error';
                statusMsg.style.display = 'block';
                uploadSection.style.display = 'block';
            }
        }

        // --- الرفع اليدوي ---
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            if(e.target.files.length > 0) {
                const file = e.target.files[0];
                const statusMsg = document.getElementById('statusMsg');
                
                if(file.type !== "application/pdf") {
                    statusMsg.innerHTML = '<i class="fas fa-times"></i> يرجى رفع ملف PDF فقط.';
                    statusMsg.className = 'status-msg status-error';
                    statusMsg.style.display = 'block';
                    return;
                }

                statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تحليل الملف (لن يستغرق سوى ثواني)...';
                statusMsg.className = 'status-msg';
                statusMsg.style.display = 'block';

                const formData = new FormData();
                formData.append("file", file);

                try {
                    const response = await fetch('/api/extract', { method: 'POST', body: formData });
                    const result = await response.json();
                    
                    if (result.status === "error") {
                        statusMsg.innerHTML = `<i class="fas fa-times-circle"></i> ${sanitize(result.message)}`;
                        statusMsg.className = 'status-msg status-error';
                        return;
                    }
                    
                    saveAndInitData(result.data, `<i class="fas fa-check-circle"></i> تم رفع وتحليل الملف بنجاح!`);
                } catch (error) {
                    statusMsg.innerHTML = '<i class="fas fa-times-circle"></i> فشل الاتصال بالخادم. يرجى المحاولة مرة أخرى.';
                    statusMsg.className = 'status-msg status-error';
                }
            }
        });

        function saveAndInitData(data, successMessage) {
            networkData = data;
            localStorage.setItem('amana_network_data', JSON.stringify(networkData));
            
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.innerHTML = successMessage;
            statusMsg.className = 'status-msg status-success';
            statusMsg.style.display = 'block';
            
            document.getElementById('uploadSection').style.display = 'none';
            document.getElementById('btnFetch').style.display = 'none';
            document.getElementById('btnReset').style.display = 'inline-flex';
            
            initFilters();
        }

        // --- الفلاتر ---
        function initFilters() {
            document.getElementById('filtersBox').style.display = 'grid';
            
            const classes = [...new Set(networkData.map(i => i.insurance_class))].filter(Boolean).sort();
            const cities = [...new Set(networkData.map(i => i.city))].filter(Boolean).sort(sortArabic);
            
            const classSelect = document.getElementById('insuranceClassSelect');
            const citySelect = document.getElementById('citySelect');
            
            classSelect.innerHTML = '<option value="">جميع فئات التأمين</option>';
            citySelect.innerHTML = '<option value="">اختر المدينة</option>';
            
            classes.forEach(c => classSelect.innerHTML += `<option value="${sanitize(c)}">${sanitize(c)}</option>`);
            cities.forEach(c => citySelect.innerHTML += `<option value="${sanitize(c)}">${sanitize(c)}</option>`);
            
            applyFilters();
        }

        document.getElementById('citySelect').addEventListener('change', function() {
            const distSelect = document.getElementById('districtSelect');
            distSelect.innerHTML = '<option value="">اختر الحي (الكل)</option>';
            
            if(this.value) {
                distSelect.disabled = false;
                const dists = [...new Set(networkData.filter(i => i.city === this.value).map(i => i.district))].filter(Boolean).sort(sortArabic);
                dists.forEach(d => distSelect.innerHTML += `<option value="${sanitize(d)}">${sanitize(d)}</option>`);
            } else {
                distSelect.disabled = true;
            }
            applyFilters();
        });

        document.getElementById('insuranceClassSelect').addEventListener('change', applyFilters);
        document.getElementById('districtSelect').addEventListener('change', applyFilters);

        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 300);
        });

        function applyFilters() {
            const term = normalizeArabic(document.getElementById('searchInput').value);
            const insClass = document.getElementById('insuranceClassSelect').value;
            const city = document.getElementById('citySelect').value;
            const dist = document.getElementById('districtSelect').value;

            currentFilteredData = networkData.filter(item => {
                const normalizedName = normalizeArabic(item.name || "");
                return (!insClass || item.insurance_class === insClass) &&
                       (!city || item.city === city) &&
                       (!dist || item.district === dist) &&
                       (!term || normalizedName.includes(term));
            });

            displayedCount = 0;
            document.getElementById('resultsContainer').innerHTML = '';
            loadMoreCards();
        }

        function loadMoreCards() {
            const container = document.getElementById('resultsContainer');
            const btn = document.getElementById('loadMoreBtn');
            
            if(currentFilteredData.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 3rem; color: var(--text-muted); font-size: 1.2rem;"><i class="fas fa-search-minus" style="font-size:2rem; margin-bottom:10px;"></i><br>لا توجد مستشفيات مطابقة لبحثك</div>`;
                btn.style.display = 'none';
                return;
            }

            const nextBatch = currentFilteredData.slice(displayedCount, displayedCount + ITEMS_PER_PAGE);
            
            nextBatch.forEach(item => {
                const mapQuery = encodeURIComponent(`${item.name} ${item.city} السعودية`);
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

                const phoneHtml = item.phone ? `<div class="contact-box"><i class="fas fa-phone-alt"></i> ${sanitize(item.phone)}</div>` : '';
                
                let typeBadge = '';
                if(item.type === 'حكومي') {
                    typeBadge = `<span class="badge badge-gov"><i class="fas fa-landmark"></i> حكومي</span>`;
                } else if(item.type === 'خاص') {
                    typeBadge = `<span class="badge badge-pvt"><i class="fas fa-building"></i> خاص</span>`;
                }

                container.insertAdjacentHTML('beforeend', `
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">${sanitize(item.name)}</h3>
                            <div class="badges-container">
                                <span class="badge badge-class">فئة ${sanitize(item.insurance_class) || 'عام'}</span>
                                ${typeBadge}
                            </div>
                        </div>
                        <div class="info-row"><i class="fas fa-map-marker-alt"></i> <span>${sanitize(item.city)} - ${sanitize(item.district)}</span></div>
                        <div class="info-row"><i class="fas fa-hospital"></i> <span>${sanitize(item.category)}</span></div>
                        ${phoneHtml}
                        <a href="${mapUrl}" target="_blank" class="map-btn"><i class="fas fa-location-arrow"></i> الموقع (خرائط جوجل)</a>
                    </div>`);
            });

            displayedCount += nextBatch.length;
            
            if(displayedCount >= currentFilteredData.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'block';
                btn.innerText = `عرض المزيد (${currentFilteredData.length - displayedCount} متبقي)`;
            }
        }
    </script>
</body>
</html>
